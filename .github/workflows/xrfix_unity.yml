name: XRFix Unity CodeQL Analysis

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Target Unity repo URL'
        required: true
        default: 'https://github.com/ExtendRealityLtd/VRTK'
      commit_sha:
        description: 'Commit SHA (buggy version)'
        required: true
      bug_id:
        description: 'Bug ID for tracking'
        required: true
      unity_version:
        description: 'Unity version (e.g. 2020.3.33f1)'
        required: true
        default: '2020.3.33f1'

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v4

      - name: Clone target repo
        run: |
          git clone --depth 500 ${{ github.event.inputs.repo_url }} target_repo
          cd target_repo
          git checkout ${{ github.event.inputs.commit_sha }} || git checkout ${{ github.event.inputs.commit_sha }}~1
          echo "=== Unity ProjectVersion ==="
          cat ProjectSettings/ProjectVersion.txt 2>/dev/null || echo "No ProjectVersion.txt"
          echo "=== C# file count ==="
          find . -name "*.cs" | wc -l

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: target_repo/Library
          key: Library-${{ github.event.inputs.repo_url }}-${{ github.event.inputs.unity_version }}

      - name: Unity Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: target_repo
          unityVersion: ${{ github.event.inputs.unity_version }}
          targetPlatform: StandaloneLinux64
          buildMethod: ''
          # We don't need an actual build output, just need Unity to compile scripts
          # Using allowDirtyBuild to skip clean checks
          allowDirtyBuild: true

      - name: Setup CodeQL
        run: |
          wget -q https://github.com/github/codeql-cli-binaries/releases/download/v2.16.3/codeql-linux64.zip
          unzip -q codeql-linux64.zip
          echo "$PWD/codeql" >> $GITHUB_PATH
          git clone --depth 1 --branch codeql-cli/v2.16.3 https://github.com/github/codeql.git codeql-repo

          # Copy XRFix queries
          mkdir -p codeql-repo/csharp/ql/src/unityCheck/{allocate,instantiate,rigidbody}
          cp xrfix_queries/allocate/*.ql codeql-repo/csharp/ql/src/unityCheck/allocate/
          cp xrfix_queries/instantiate/*.ql codeql-repo/csharp/ql/src/unityCheck/instantiate/
          cp xrfix_queries/rigidbody/*.ql codeql-repo/csharp/ql/src/unityCheck/rigidbody/

      - name: Create CodeQL database
        run: |
          # After Unity compiles, .sln and .csproj should exist
          cd target_repo
          ls -la *.sln 2>/dev/null || echo "No .sln found"
          ls -la *.csproj 2>/dev/null || echo "No .csproj found"
          cd ..

          codeql database create codeql-db \
            --language=csharp \
            --source-root=target_repo \
            --command="echo 'Using pre-compiled assemblies'" \
            --search-path=codeql-repo \
            2>&1 | tail -30

      - name: Run XRFix queries
        run: |
          mkdir -p results

          for ql_file in codeql-repo/csharp/ql/src/unityCheck/*/*.ql; do
            QUERY_NAME=$(basename "$ql_file" .ql)
            echo "=== Running $QUERY_NAME ==="
            codeql database analyze codeql-db \
              "$ql_file" \
              --format=csv \
              --output="results/${QUERY_NAME}.csv" \
              --search-path=codeql-repo \
              --additional-packs=codeql-repo \
              2>&1 | tail -10

            if [ -f "results/${QUERY_NAME}.csv" ]; then
              HITS=$(tail -n +2 "results/${QUERY_NAME}.csv" | wc -l)
              echo "$QUERY_NAME: $HITS findings"
            else
              echo "$QUERY_NAME: FAILED"
            fi
          done

      - name: Summary
        run: |
          echo "============================================"
          echo "Bug ID: ${{ github.event.inputs.bug_id }}"
          echo "Repo: ${{ github.event.inputs.repo_url }}"
          echo "Commit: ${{ github.event.inputs.commit_sha }}"
          echo "============================================"
          TOTAL=0
          for f in results/*.csv; do
            if [ -f "$f" ]; then
              C=$(tail -n +2 "$f" | wc -l)
              TOTAL=$((TOTAL + C))
              echo "$(basename $f): $C findings"
            fi
          done
          echo "TOTAL: $TOTAL findings"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: xrfix-${{ github.event.inputs.bug_id }}
          path: results/
