name: XRFix Batch Analysis

on:
  workflow_dispatch:
    inputs:
      batch_start:
        description: 'Start index (0-based)'
        required: true
        default: '0'
      batch_size:
        description: 'Number of repos to scan in this run'
        required: true
        default: '10'

jobs:
  xrfix-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v4

      - name: Setup CodeQL
        run: |
          wget -q https://github.com/github/codeql-cli-binaries/releases/download/v2.16.3/codeql-linux64.zip
          unzip -q codeql-linux64.zip
          echo "$PWD/codeql" >> $GITHUB_PATH
          git clone --depth 1 --branch codeql-cli/v2.16.3 https://github.com/github/codeql.git codeql-repo

      - name: Run batch scan
        run: |
          START=${{ github.event.inputs.batch_start }}
          SIZE=${{ github.event.inputs.batch_size }}
          mkdir -p all_results

          # Copy XRFix queries into codeql-repo so they can resolve imports
          mkdir -p codeql-repo/csharp/ql/src/unityCheck/allocate
          mkdir -p codeql-repo/csharp/ql/src/unityCheck/instantiate
          mkdir -p codeql-repo/csharp/ql/src/unityCheck/rigidbody
          cp xrfix_queries/allocate/*.ql codeql-repo/csharp/ql/src/unityCheck/allocate/
          cp xrfix_queries/instantiate/*.ql codeql-repo/csharp/ql/src/unityCheck/instantiate/
          cp xrfix_queries/rigidbody/*.ql codeql-repo/csharp/ql/src/unityCheck/rigidbody/

          # Read repos_to_scan.json and process batch
          python3 << 'PYEOF'
          import json, subprocess, os

          with open("repos_to_scan.json") as f:
              repos = json.load(f)

          start = int(os.environ.get("START", "${{ github.event.inputs.batch_start }}"))
          size = int(os.environ.get("SIZE", "${{ github.event.inputs.batch_size }}"))
          batch = repos[start:start+size]

          print(f"Processing {len(batch)} repos (index {start} to {start+len(batch)-1})")

          results = []
          for i, item in enumerate(batch):
              repo = item["repo"]
              commit_raw = item["commit"]
              bug_id = item["bug_id"]
              # Remove ~1, we'll handle parent in git
              commit = commit_raw.replace("~1", "")

              print(f"\n{'='*60}")
              print(f"[{i+1}/{len(batch)}] {bug_id}")
              print(f"Repo: {repo}, Commit: {commit}")
              print(f"{'='*60}")

              repo_dir = f"target_{i}"
              result = {"bug_id": bug_id, "repo": repo, "commit": commit, "db_ok": False, "findings": {}}

              try:
                  # Clone
                  r = subprocess.run(
                      ["git", "clone", "--depth", "500", f"https://github.com/{repo}", repo_dir],
                      capture_output=True, text=True, timeout=120
                  )
                  if r.returncode != 0:
                      print(f"Clone failed: {r.stderr[:200]}")
                      results.append(result)
                      continue

                  # Checkout parent of fix commit
                  r = subprocess.run(
                      ["git", "checkout", f"{commit}~1"],
                      capture_output=True, text=True, cwd=repo_dir, timeout=30
                  )
                  if r.returncode != 0:
                      # Try checkout the commit itself
                      r = subprocess.run(
                          ["git", "checkout", commit],
                          capture_output=True, text=True, cwd=repo_dir, timeout=30
                      )
                      if r.returncode != 0:
                          print(f"Checkout failed: {r.stderr[:200]}")
                          results.append(result)
                          continue

                  # Count C# files
                  cs_count = subprocess.run(
                      ["bash", "-c", f"find {repo_dir} -name '*.cs' | wc -l"],
                      capture_output=True, text=True
                  )
                  print(f"C# files: {cs_count.stdout.strip()}")

                  # Create CodeQL database (skip build for Unity projects)
                  r = subprocess.run(
                      ["codeql", "database", "create", f"db_{i}",
                       "--language=csharp",
                       f"--source-root={repo_dir}",
                       "--command=true",
                       "--search-path=codeql-repo"],
                      capture_output=True, text=True, timeout=300
                  )
                  if r.returncode != 0:
                      print(f"DB creation failed: {r.stderr[:300]}")
                      results.append(result)
                      continue

                  result["db_ok"] = True

                  # Run each query
                  queries = {
                      "new_alloc": "codeql-repo/csharp/ql/src/unityCheck/allocate/comp_new_allocation.ql",
                      "destroy": "codeql-repo/csharp/ql/src/unityCheck/instantiate/comp_destroy_in_update.ql",
                      "instantiate": "codeql-repo/csharp/ql/src/unityCheck/instantiate/comp_instan_in_update.ql",
                      "rigidbody": "codeql-repo/csharp/ql/src/unityCheck/rigidbody/comp_rigidbody_transform_in_update.ql",
                  }

                  for qname, qpath in queries.items():
                      out_csv = f"all_results/{bug_id}_{qname}.csv"
                      r = subprocess.run(
                          ["codeql", "database", "analyze", f"db_{i}",
                           qpath,
                           "--format=csv",
                           f"--output={out_csv}",
                           "--search-path=codeql-repo",
                           "--additional-packs=codeql-repo"],
                          capture_output=True, text=True, timeout=300
                      )
                      if r.returncode == 0 and os.path.exists(out_csv):
                          with open(out_csv) as cf:
                              lines = cf.readlines()
                          hits = max(0, len(lines) - 1)  # minus header
                          result["findings"][qname] = hits
                          print(f"  {qname}: {hits} findings")
                      else:
                          result["findings"][qname] = -1
                          print(f"  {qname}: FAILED - {r.stderr[:500]}")

              except Exception as e:
                  print(f"Error: {e}")

              finally:
                  # Cleanup to save disk
                  subprocess.run(["rm", "-rf", repo_dir, f"db_{i}"], capture_output=True)

              results.append(result)

          # Write summary
          print(f"\n{'='*60}")
          print("BATCH SUMMARY")
          print(f"{'='*60}")
          total_bugs = len(results)
          db_ok = sum(1 for r in results if r["db_ok"])
          detected = sum(1 for r in results if r["db_ok"] and sum(v for v in r["findings"].values() if v > 0) > 0)

          print(f"Total bugs: {total_bugs}")
          print(f"DB created successfully: {db_ok}")
          print(f"Bugs with XRFix findings: {detected}")
          print(f"Detection rate: {detected}/{db_ok} = {detected/max(db_ok,1)*100:.1f}%")

          with open("all_results/batch_summary.json", "w") as f:
              json.dump({"results": results, "total": total_bugs, "db_ok": db_ok, "detected": detected}, f, indent=2)

          PYEOF

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: xrfix-batch-${{ github.event.inputs.batch_start }}
          path: all_results/
